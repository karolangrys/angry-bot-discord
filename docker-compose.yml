# Deployment file. `build:` is deliberately absent: only this file is copied to the VPS, so there is
# no build context there and `docker compose up` must never try to build.
#
# IMAGE_OWNER (required) and IMAGE_TAG (optional, defaults to latest) are read from the shell or from
# the `.env` file next to this one.
services:
  discord-bot:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER to your lowercase GitHub owner}/angry-bot-discord:${IMAGE_TAG:-latest}
    container_name: angry-bot-discord
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: data/sqlite.db
      LOG_DIR: logs
      NODE_ENV: production
    volumes:
      # Both directories must be writable by uid 1000 (the `bun` user inside the container).
      - ./data:/app/data
      - ./logs:/app/logs
    # Give the graceful shutdown in src/core/index.ts time to close SQLite cleanly.
    stop_grace_period: 20s
    # Required by /js-task, not optional tuning. Bun has no working per-process heap cap (measured
    # on 1.3.14: --smol, --max-old-space-size and BUN_JSC_forceRAMSize all fail to stop a runaway
    # allocation), so this cgroup limit is what bounds a memory bomb in a sandboxed script.
    # Measured behaviour with this limit in place: the sandbox subprocess is OOM-killed after ~2.6s
    # and the bot survives, because the kernel targets the largest consumer. Without the limit,
    # nothing stops the allocation until the 10s sandbox timeout.
    mem_limit: 512m
    # Backstop against a script that spawns processes in a loop.
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
